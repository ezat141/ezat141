<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-labelledby="t"><title id="t">section divider</title><style>@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}@keyframes fadeIn{from{opacity:0}}@keyframes blink{50%{opacity:0}}@keyframes pulse{from{transform:scale(1);opacity:.75}to{transform:scale(2.2);opacity:0}}.ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}@keyframes slide{from{transform:translateX(-180px)}to{transform:translateX(1200px)}}.p1{animation:slide 6.5s cubic-bezier(.45,0,.55,1) infinite}</style><defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#2A3A62" stop-opacity="0"/><stop offset=".5" stop-color="#2A3A62"/><stop offset="1" stop-color="#2A3A62" stop-opacity="0"/></linearGradient><linearGradient id="pl" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs><rect y="11.5" width="1200" height="1" fill="url(#ln)"/><rect y="11" width="180" height="2" fill="url(#pl)" class="p1 motion"/><rect x="596" y="8" width="8" height="8" transform="rotate(45 600 12)" fill="none" stroke="#22D3EE" stroke-width="1.2"/></svg>